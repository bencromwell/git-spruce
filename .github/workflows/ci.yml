name: CI

on: [push]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      # the repo pins golangci-lint v1.64.8 in the Makefile, matching the
      # v1-format .golangci.yaml; the golangci-lint action only serves v2
      - name: golangci-lint
        run: make lint

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Check if mods are tidy
        run: make check-tidy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Run tests with coverage
        run: make test
        env:
          TESTARGS: "-covermode=atomic -coverprofile=./coverage.out"
      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o=coverage.html
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: $COVERAGE%"
          # Use awk for comparison (more portable than bc)
          awk "BEGIN {if ($COVERAGE < 55) {print \"FAIL: Coverage below 55%\" > \"/dev/stderr\"; exit 1} else {print \"PASS: Coverage meets threshold\"}}"
      - name: Upload coverage report to artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error
